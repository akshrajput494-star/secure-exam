name: secure_exam_client
description: Secure Exam Center Client - Anti-leak exam distribution
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0              # REST API calls
  web_socket_channel: ^3.0.0  # WebSocket for Kafka bridge  
  local_auth: ^2.3.0         # Biometric authentication
  encrypt: ^5.0.3            # AES encryption/decryption
  pointycastle: ^3.9.1       # Crypto primitives
  pdf: ^3.11.0               # PDF generation with watermarks
  printing: ^5.13.0          # Printing support
  path_provider: ^2.1.0      # Local file storage
  flutter_secure_storage: ^9.2.0  # Secure key storage
  provider: ^6.1.0           # State management
  intl: ^0.19.0              # Date formatting
  crypto: ^3.0.3             # SHA-256 hashing
  permission_handler: ^11.3.0 # Runtime permissions
  uuid: ^4.4.0                 # Unique print job & watermark IDs
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
flutter:
  uses-material-design: true
